name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  check-msrv:
    name: Check (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo generate-lockfile
      - run: cargo check -p superlighttui --features async,serde
      - run: cargo clippy -p superlighttui --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `tests/v020_perf_alloc.rs` serialises every `#[test]` in the binary
      # via the file-wide `measure_lock` mutex (see
      # `tests/v020_perf_alloc.rs::enter_perf_test`), so the parallel test
      # runner is safe — the previous `--test-threads=1` workaround was
      # removed in v0.20.1 (#240) once the global-allocator-counter
      # cross-test contamination was fixed at the source.
      - run: cargo test --all-features

  platform-test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p superlighttui --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  docs:
    name: Doc Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="-Wmissing_docs" cargo check --all-features 2>&1 | grep -c "missing documentation" || echo "0 missing docs"

  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  check-no-default:
    name: Check (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p superlighttui --no-default-features

  check-wasm:
    name: Check (WASM backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - uses: browser-actions/setup-chrome@v1
      - uses: nanasess/setup-chromedriver@v2
      - run: cargo check -p slt-wasm --all-features --target wasm32-unknown-unknown
      - run: cargo clippy -p slt-wasm --all-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p slt-wasm --all-features
      - run: chrome --version || google-chrome --version
      - run: chromedriver --version
      - run: CHROMEDRIVER="$(command -v chromedriver)" wasm-pack test --headless --chrome crates/slt-wasm

  feature-check:
    name: Feature Combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - name: Check each feature independently
        run: cargo hack check -p superlighttui --each-feature --no-dev-deps

  deny:
    name: Deny Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, bans, licenses, sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # VHS gallery gate (issue #274). Renders every `.tape` in the repo through
  # VHS and asserts each produces its declared `Output` asset at a non-trivial
  # byte size. Generated assets are uploaded as a workflow artifact for visual
  # diff review; they are NOT auto-committed (binary churn + non-determinism).
  gallery:
    name: VHS Gallery
    runs-on: ubuntu-latest
    # Advisory: VHS rendering needs a virtual TTY + ttyd + ffmpeg and runs the
    # release examples headlessly, which is inherently finicky in CI. The hard
    # gate for README <-> tape parity is the `gallery_manifest` test in the Test
    # job (plain `cargo test`); this job regenerates the demo GIF gallery and
    # uploads it as a best-effort artifact, so a flake here must not block merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `charmbracelet/vhs-action@v2` unconditionally runs its own bundled
      # ffmpeg installer, which is persistently broken on the GitHub runner
      # (observed across reruns: "Failed to install ffmpeg") and ignores an
      # ffmpeg that is already present. Install the toolchain ourselves instead:
      #   - ffmpeg from apt (the package the action fails to fetch as a static
      #     build),
      #   - ttyd from its upstream release binary (not reliably in apt), and
      #   - vhs via `go install` (Go is preinstalled on ubuntu-latest).
      # This drops the flaky action entirely while producing the same toolchain.
      - name: Install VHS toolchain (ffmpeg, ttyd, vhs)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64 \
            -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify VHS toolchain
        run: |
          vhs --version
          ttyd --version
          ffmpeg -version | head -1
      - name: Build release examples
        run: cargo build --release --examples
      - name: Render every tape
        run: |
          shopt -s nullglob
          for t in *.tape; do
            echo "::group::vhs $t"
            vhs "$t"
            echo "::endgroup::"
          done
      - name: Assert each tape produced a non-trivial artifact
        run: |
          shopt -s nullglob
          status=0
          for t in *.tape; do
            out=$(grep -m1 '^Output' "$t" | awk '{print $2}')
            if [ ! -s "$out" ]; then
              echo "::error::$t produced no/empty $out"
              status=1
              continue
            fi
            size=$(wc -c < "$out")
            if [ "$size" -lt 1024 ]; then
              echo "::error::$t produced a trivially small $out ($size bytes)"
              status=1
            fi
          done
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: assets/
