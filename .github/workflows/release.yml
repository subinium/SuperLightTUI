name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (for example, v0.22.3)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  check-stable:
    name: Check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo build --manifest-path tests/fixtures/runtime_abort/Cargo.toml --target-dir target/runtime-abort
      - run: python3 tests/support/runtime_pty.py target/runtime-abort/debug/slt-runtime-abort abort_boundary
      - run: python3 tests/support/runtime_pty.py target/runtime-abort/debug/slt-runtime-abort abort_background

  platform-test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p superlighttui --all-features

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --examples --all-features

  api-audit:
    name: API Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/api_audit.sh --strict
      - run: python3 scripts/check_doc_examples_test.py --toolchain stable --compile-negative
      - run: python3 scripts/check_doc_examples.py --toolchain stable
      - run: python3 -m unittest discover -s scripts -p smoke_wasm_release_test.py
      - run: python3 -m unittest discover -s scripts -p smoke_native_release_test.py

  msrv:
    name: Check (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo generate-lockfile
      - run: cargo check -p superlighttui --features async,serde
      - run: cargo clippy -p superlighttui --all-features -- -D warnings

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: crate-ci/typos@master

  check-no-default:
    name: Check (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p superlighttui --no-default-features

  wasm-backend:
    name: Check (WASM backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - uses: browser-actions/setup-chrome@v2
      - uses: nanasess/setup-chromedriver@v2
      - name: Install CJK fonts for browser pixel checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-match 'monospace:lang=ko'
      - run: cargo check -p slt-wasm --all-features --target wasm32-unknown-unknown
      - run: cargo clippy -p slt-wasm --all-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p slt-wasm --all-features
      - run: chrome --version || google-chrome --version
      - run: chromedriver --version
      - run: CHROMEDRIVER="$(command -v chromedriver)" wasm-pack test --headless --chrome crates/slt-wasm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/slt-wasm/examples/browser/package-lock.json
      - run: npm ci --prefix crates/slt-wasm/examples/browser
      - run: wasm-pack build crates/slt-wasm/examples/browser --target web --dev -- --features browser-tests
      - run: CHROME_EXECUTABLE="$(command -v chrome || command -v google-chrome)" npm test --prefix crates/slt-wasm/examples/browser
      - run: cargo package --workspace --no-default-features --target wasm32-unknown-unknown --target-dir "$(mktemp -d "$RUNNER_TEMP/slt-package.XXXXXX")" --locked

  feature-check:
    name: Feature Combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - name: Check each feature independently
        run: cargo hack check -p superlighttui --each-feature --no-dev-deps

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions-rust-lang/audit@v1

  deny:
    name: Deny Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check tag matches package versions
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG#v}"
          ROOT_VER=$(awk -F'"' '/^version =/ { print $2; exit }' Cargo.toml)
          WASM_VER=$(awk -F'"' '/^version =/ { print $2; exit }' crates/slt-wasm/Cargo.toml)
          WASM_DEP=$(sed -n 's/.*superlighttui = { version = "\([^"]*\)".*/\1/p' crates/slt-wasm/Cargo.toml)

          if [ "$TAG" != "$ROOT_VER" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $ROOT_VER"
            exit 1
          fi
          if [ "$TAG" != "$WASM_VER" ]; then
            echo "::error::Tag v$TAG does not match slt-wasm version $WASM_VER"
            exit 1
          fi
          if [ "$TAG" != "$WASM_DEP" ]; then
            echo "::error::Tag v$TAG does not match slt-wasm dependency $WASM_DEP"
            exit 1
          fi
          echo "Version verified: $TAG"

  publish-superlighttui:
    name: Publish superlighttui
    needs:
      - fmt
      - check-stable
      - clippy
      - test
      - platform-test
      - examples
      - api-audit
      - msrv
      - typos
      - check-no-default
      - wasm-backend
      - feature-check
      - audit
      - deny
      - verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish superlighttui if needed
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          INDEX_URL="https://index.crates.io/su/pe/superlighttui"
          if curl --fail --silent --show-error --location "$INDEX_URL" \
            | grep -F "\"vers\":\"$VERSION\"" >/dev/null; then
            echo "superlighttui $VERSION is already published"
            exit 0
          fi
          cargo publish -p superlighttui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-slt-wasm:
    name: Publish slt-wasm
    needs: [publish-superlighttui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for superlighttui on crates.io
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          INDEX_URL="https://index.crates.io/su/pe/superlighttui"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location "$INDEX_URL" \
              | grep -F "\"vers\":\"$VERSION\"" >/dev/null; then
              echo "superlighttui $VERSION is visible in the crates.io index"
              exit 0
            fi
            echo "Waiting for superlighttui $VERSION in crates.io index (attempt $attempt/30)"
            sleep 10
          done
          echo "::error::superlighttui $VERSION did not appear in crates.io index"
          exit 1
      - name: Publish slt-wasm if needed
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          INDEX_URL="https://index.crates.io/sl/t-/slt-wasm"
          if curl --fail --silent --show-error --location "$INDEX_URL" \
            | grep -F "\"vers\":\"$VERSION\"" >/dev/null; then
            echo "slt-wasm $VERSION is already published"
            exit 0
          fi
          cargo publish -p slt-wasm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  verify-published:
    name: Verify Published Packages
    needs: [publish-superlighttui, publish-slt-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - uses: browser-actions/setup-chrome@v2
      - uses: nanasess/setup-chromedriver@v2
      - name: Install CJK fonts for browser pixel checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-match 'monospace:lang=ko'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix crates/slt-wasm/examples/browser
      - run: bash scripts/smoke_release.sh "${RELEASE_TAG#v}"
      - run: python3 scripts/smoke_native_release.py "${RELEASE_TAG#v}" --expect-commit "$(git rev-parse HEAD)"
      - run: CHROME_EXECUTABLE="$(command -v chrome || command -v google-chrome)" python3 scripts/smoke_wasm_release.py "${RELEASE_TAG#v}" --expect-commit "$(git rev-parse HEAD)"

  github-release:
    name: GitHub Release
    needs: [publish-superlighttui, publish-slt-wasm, verify-published]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release v${VERSION}"
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "$BODY"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
