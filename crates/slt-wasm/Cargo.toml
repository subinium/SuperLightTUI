[package]
name = "slt-wasm"
version = "0.22.0"
edition = "2024"
rust-version = "1.88"
description = "WASM/browser backend for SuperLightTUI"
license = "MIT"
repository = "https://github.com/subinium/SuperLightTUI"
homepage = "https://github.com/subinium/SuperLightTUI"
documentation = "https://docs.rs/slt-wasm"

[dependencies]
superlighttui = { version = "0.22.0", path = "../..", default-features = false }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlPreElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "Text",
    "Window",
    "console",
] }
js-sys = "0.3"

[lints]
workspace = true
