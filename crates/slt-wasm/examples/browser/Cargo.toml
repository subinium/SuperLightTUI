[package]
name = "slt-browser-example"
version = "0.24.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
superlighttui = { path = "../../../..", default-features = false }
slt-wasm = { path = "../.." }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "Event", "EventTarget"] }

[features]
browser-tests = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
