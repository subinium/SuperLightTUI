[default.extend-words]
"tui" = "tui"
"bg" = "bg"
"fg" = "fg"
"ratatui" = "ratatui"
"ba" = "ba"
"hel" = "hel"
"PnL" = "PnL"
"Pn" = "Pn"
"flate" = "flate"
"flate2" = "flate2"
# Intentional truncation-test prefixes used in tests/widgets.rs to verify
# label-clipping behaviour. They look like typos because they ARE bare
# truncations — that's the point of the assertions.
"Pytho" = "Pytho"
"Memor" = "Memor"

[files]
extend-exclude = [
    "CHANGELOG.md",
    "Cargo.lock",
    "AUDIT-REPORT.md",
    "docs/README.*.md",
    # Visual regression snapshots can contain truncated text the typos
    # checker misreads as misspellings (e.g. "anc" cut from "anchor").
    "tests/snapshots/visual__*.snap",
]
