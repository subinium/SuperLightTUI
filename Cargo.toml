[workspace]
members = [".", "crates/slt-wasm"]

[package]
name = "superlighttui"
version = "0.21.1"
edition = "2021"
description = "Super Light TUI - A lightweight, ergonomic terminal UI library"
license = "MIT"
repository = "https://github.com/subinium/SuperLightTUI"
homepage = "https://github.com/subinium/SuperLightTUI"
documentation = "https://docs.rs/superlighttui"
readme = "README.md"
keywords = ["tui", "terminal", "cli", "ui", "immediate-mode"]
categories = ["command-line-interface"]
rust-version = "1.81"
# Keep the published crate to library + docs only. The agent/skill scaffolding,
# VHS recordings, and dev/CI config are not needed by downstream consumers
# (they were leaking into 0.21.0's tarball — ~140KB of non-library content).
exclude = [
    "examples/",
    ".github/",
    "assets/",
    "AUDIT-REPORT.md",
    "CLAUDE.md",
    "AGENTS.md",
    ".agents/",
    ".claude/",
    "scripts/",
    "deny.toml",
    "_typos.toml",
    "*.tape",
    ".gitignore",
]
# Disable cargo's `examples/*.rs` auto-discovery: only the binaries listed
# below as `[[example]]` are exposed via `cargo run --example`. Source
# demos that compose into a tour (v020_*, cookbook_*, most demo_*,
# anim, async_demo, inline, error_boundary_demo) stay in examples/ but
# are reached only via `#[path = ...] mod` includes from the tour
# binaries. See `docs/DEMO_GUIDE.md` for the archetype rules and the
# v0.20 release notes for why these were merged into tours.
autoexamples = false

[lib]
name = "slt"

[dependencies]
crossterm = { version = "0.28", features = ["bracketed-paste"], optional = true }
unicode-width = "0.2"
# Upper-bounded for MSRV 1.81: unicode-segmentation 1.13+ requires rustc 1.85.
unicode-segmentation = ">=1.0, <1.13"
smallvec = "1"
# MSRV 1.81 pin only (not used directly): a transitive dep via `toml`
# (the `serde`/`theme-watch` features). indexmap 2.10+ requires the
# `edition2024` Cargo feature (rustc 1.85), which breaks the MSRV gate's
# `cargo generate-lockfile` + 1.81 check. Bound it below that.
indexmap = ">=2.0, <2.10"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
notify = { version = "6", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
compact_str = { version = "0.9.0", default-features = false }
unicode-bidi = { version = "0.3", optional = true }
flate2 = { version = "1", optional = true }
qrcode = { version = "0.14", optional = true, default-features = false }
tree-sitter-highlight = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }

# Unix job-control suspend/resume (Ctrl+Z / `fg`). Safe API only — used to
# restore the terminal before SIGTSTP stops the process and re-enter it on
# SIGCONT, preserving `#![forbid(unsafe_code)]` (issue #263). Target-gated so
# non-unix builds (Windows/WASM) never pull it.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
proptest = "1"
serde_json = "1"

[features]
crossterm = ["dep:crossterm", "dep:signal-hook"]
bidi = ["dep:unicode-bidi"]
default = ["crossterm", "bidi"]
async = ["dep:tokio", "crossterm"]
serde = ["dep:serde", "dep:toml"]
theme-watch = ["serde", "dep:notify"]
image = ["dep:image"]
qrcode = ["dep:qrcode"]
syntax-rust = ["dep:tree-sitter-highlight", "dep:tree-sitter-rust"]
syntax-python = ["dep:tree-sitter-highlight", "dep:tree-sitter-python"]
syntax-javascript = ["dep:tree-sitter-highlight", "dep:tree-sitter-javascript"]
syntax-go = ["dep:tree-sitter-highlight", "dep:tree-sitter-go"]
syntax-bash = ["dep:tree-sitter-highlight", "dep:tree-sitter-bash"]
syntax-json = ["dep:tree-sitter-highlight", "dep:tree-sitter-json"]
syntax-toml = ["dep:tree-sitter-highlight", "dep:tree-sitter-toml-ng"]
syntax-c = ["dep:tree-sitter-highlight", "dep:tree-sitter-c"]
syntax-cpp = ["dep:tree-sitter-highlight", "dep:tree-sitter-cpp"]
syntax-typescript = ["dep:tree-sitter-highlight", "dep:tree-sitter-typescript"]
syntax-java = ["dep:tree-sitter-highlight", "dep:tree-sitter-java"]
syntax-ruby = ["dep:tree-sitter-highlight", "dep:tree-sitter-ruby"]
syntax-css = ["dep:tree-sitter-highlight", "dep:tree-sitter-css"]
syntax-html = ["dep:tree-sitter-highlight", "dep:tree-sitter-html"]
syntax-yaml = ["dep:tree-sitter-highlight", "dep:tree-sitter-yaml"]
syntax = [
    "syntax-rust",
    "syntax-python",
    "syntax-javascript",
    "syntax-typescript",
    "syntax-go",
    "syntax-bash",
    "syntax-json",
    "syntax-toml",
    "syntax-c",
    "syntax-cpp",
    "syntax-java",
    "syntax-ruby",
    "syntax-css",
    "syntax-html",
    "syntax-yaml",
]
kitty-compress = ["dep:flate2"]
# Dev-only test harness (issue #274): exposes `PtyBackend`/`PtyFrame`, which
# drive the real `Terminal` flush pipeline into an in-process byte sink for
# end-to-end escape-code / image-protocol assertions. Off by default; pulls
# `crossterm` for the SGR/queue! emitters. Not part of `full`.
pty-test = ["crossterm"]
full = ["crossterm", "async", "serde", "theme-watch", "image", "qrcode", "kitty-compress", "bidi"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# ── Tour binaries (6) — integrated demos covering v0.20 features and
#    domain showcases. Each tour bundles 4–10 source demos via the
#    DEMO_GUIDE.md archetype rules. Run these for end-to-end review.

[[example]]
name = "v020_tour"
path = "examples/v020_tour.rs"

[[example]]
name = "cookbook_tour"
path = "examples/cookbook_tour.rs"

[[example]]
name = "showcase_tour"
path = "examples/showcase_tour.rs"

[[example]]
name = "canvas_tour"
path = "examples/canvas_tour.rs"

[[example]]
name = "text_tour"
path = "examples/text_tour.rs"

[[example]]
name = "system_tour"
path = "examples/system_tour.rs"
required-features = ["async"]

# ── Standalone — entry / how-to-start (3)

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "color_picker"
path = "examples/color_picker.rs"

[[example]]
name = "counter"
path = "examples/counter.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

# ── Standalone — performance measurement (2)

[[example]]
name = "perf_interactive"
path = "examples/perf_interactive.rs"

[[example]]
name = "perf_regression"
path = "examples/perf_regression.rs"

# ── Standalone — development tools (3)

[[example]]
name = "debug_selection"
path = "examples/debug_selection.rs"

[[example]]
name = "test_mouse"
path = "examples/test_mouse.rs"

[[example]]
name = "demo_key_test"
path = "examples/demo_key_test.rs"

[[example]]
name = "theme_hot_reload"
path = "examples/theme_hot_reload.rs"
required-features = ["theme-watch"]

# ── v0.20 non-interactive reports (2) — kept standalone because they
#    print to stdout rather than render a TUI, so they don't compose
#    into v020_tour.

[[example]]
name = "v020_perf_audit"
path = "examples/v020_perf_audit.rs"

[[example]]
name = "v020_test_utils"
path = "examples/v020_test_utils.rs"

# ── v0.21 coverage ──────────────────────────────────────────────────
# v0210_widgets: paginator / number_input / variable-height virtual_list /
#   scheduler / devtools inspector (widgets that shipped in 0.21.0 without a
#   dedicated example). v0211_tour: the 0.21.1 API additions.

[[example]]
name = "v0210_widgets"
path = "examples/v0210_widgets.rs"

[[example]]
name = "v0211_tour"
path = "examples/v0211_tour.rs"

[[bench]]
name = "benchmarks"
harness = false
